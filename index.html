<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Stable A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- Local aframe-ar -->
    <script src="./aframe-ar-main/dist/aframe-ar.min.js"></script>
    <title>MarkLess</title>
</head>
<body>
    <script>
      function showMessage(message){
        let hud = document.querySelector("#hud");
        hud.setAttribute('value', message);
      }

      AFRAME.registerComponent('ar-logic',{
        init: function(){
          showMessage('ar-logic is running...');
        },
        
        tick : function(){
          let cam = document.querySelector("cam");
          if(!cam || !cam.components.raycaster){
            return;
          }  
          let intersection = cam.components.raycaster.getIntersection(document.querySelector("#circle"));
          if(!intersection){
            return;
          }

          showMessage("Collision Detected!" + intersection.point.x.toFixed(2) + intersection.point.z.toFixed(2));

          let circle = document.querySelector("#circle");
          circle.setAttribute("position", intersection.point);
        }
      });

      window.addEventListerner("touchStart", function(){
        let box = document.querySelector("#box");
        let circle = document.querySelector("#circle");
        let pos = circle.getAttribute("position");

        let posCircle = circle.object3D.position;
        let posBox = box.object3D.position;

        box.setAttribute("position", pos);


      });
    </script>

    <a-scene ar ar-logic>
        <a-camera id="cam" ar-raycaster raycaster="objects:none;">
          <a-text id="hud" 
            value="Summa Text" 
            position="0 -0.1 -0.25"
            align="center"
            wrap-count="800"
          ></a-text>
        </a-camera>
    
        <a-ring
          id="circle"
          rotation="-90 0 0"
          radius-inner="0.01"
          radius-outer="0.02">
        </a-ring>
    
        <!-- <a-box id="box" position="0 0 -1" color="red" scale="0.2 0.2 0.2"></a-box> -->
        <a-gltf-model id="box"
        src="model/charizard.glb"
        scale="5 5 5"
        position="0 0 0"
      ></a-gltf-model>
    
    </a-scene>
</body>
</html>
